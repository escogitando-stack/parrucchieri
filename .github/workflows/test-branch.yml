name: Test PHP (branch)

# Prova l'API PHP sui branch di lavoro senza pubblicare nulla:
# la pubblicazione resta solo su main (deploy.yml).
on:
  push:
    branches-ignore: [main, master, deploy]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, mbstring

      - name: Sintassi
        run: find php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Test (API PHP)
        run: php php/tests/run.php

      - name: Dipendenze
        run: pnpm install --frozen-lockfile

      - name: Test (TypeScript)
        run: pnpm test

      - name: Compila l'interfaccia
        run: pnpm build

      # Anteprima del sito con SQLite: gh run download <id> -n anteprima
      - name: Assembla il sito
        run: scripts/assemble.sh "$RUNNER_TEMP/site"

      - name: Salva l'anteprima
        uses: actions/upload-artifact@v4
        with:
          name: anteprima
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          retention-days: 7

      - name: Prova la demo /esempio
        run: scripts/demo-smoke.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/demo"

      - name: Salva gli screenshot della demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshot
          path: ${{ runner.temp }}/demo
          retention-days: 7
